<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04060d" />
    <title>NEON SHIFT</title>
    <style>
      :root {
        --bg: #04060d;
        --ink: #eaf7ff;
        --dim: #8fb3cb;
        --dim2: rgba(143, 179, 203, 0.55);
        --line: rgba(126, 196, 236, 0.14);
        --line2: rgba(126, 196, 236, 0.3);
        --glass: rgba(9, 17, 29, 0.72);
        --cyan: #3fe9ff;
        --violet: #a78bfa;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none; overscroll-behavior: none;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; }
      body::after {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
        background: radial-gradient(125% 95% at 50% 44%, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
      }

      #hud {
        position: fixed; inset: 0; z-index: 2; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        font-variant-numeric: tabular-nums;
      }
      .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
      #score {
        font-size: clamp(34px, 10vw, 56px); font-weight: 700; line-height: 0.95; letter-spacing: -0.01em;
        text-shadow: 0 0 26px rgba(63, 233, 255, 0.45), 0 0 64px rgba(63, 233, 255, 0.22);
      }
      #chain {
        margin-top: 9px; font-size: clamp(11px, 3.1vw, 13px); letter-spacing: 0.18em;
        color: var(--cyan); min-height: 1.2em; text-shadow: 0 0 18px rgba(63, 233, 255, 0.5);
      }
      #chain::before {
        content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
        background: var(--cyan); margin-right: 8px; vertical-align: middle; box-shadow: 0 0 10px var(--cyan);
      }
      #chain:empty::before { display: none; }
      #phase, #best {
        display: block; width: fit-content; margin-left: auto;
        padding: 5px 11px; border-radius: 999px; text-transform: uppercase;
        border: 1px solid var(--line); background: rgba(10, 19, 31, 0.5);
        backdrop-filter: blur(8px);
      }
      #phase { font-size: clamp(9px, 2.6vw, 11px); letter-spacing: 0.26em; color: var(--dim); }
      #best { font-size: clamp(9px, 2.5vw, 11px); letter-spacing: 0.2em; color: var(--dim2); margin-top: 7px; }
      #pauseBtn {
        pointer-events: auto; width: 42px; height: 42px; margin-left: auto; border-radius: 14px;
        border: 1px solid var(--line2); color: #cfe9fb; font: inherit; font-size: 11px; letter-spacing: 0.1em;
        background: linear-gradient(180deg, rgba(24, 40, 60, 0.85), rgba(10, 18, 30, 0.85));
        backdrop-filter: blur(10px); display: grid; place-items: center; cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition: transform 0.12s ease, border-color 0.2s ease;
      }
      #pauseBtn:active { transform: scale(0.94); }

      #hint {
        position: fixed; left: 50%; z-index: 2;
        bottom: max(84px, calc(env(safe-area-inset-bottom) + 76px));
        transform: translateX(-50%) translateY(8px);
        padding: 11px 18px; border-radius: 999px; max-width: 86vw; text-align: center;
        background: var(--glass); border: 1px solid var(--line2); backdrop-filter: blur(14px);
        font-size: 13px; letter-spacing: 0.03em; color: #d7ecfa; opacity: 0; pointer-events: none;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      #hint.on { opacity: 1; transform: translateX(-50%) translateY(0); }
      #hint::before {
        content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
        background: var(--cyan); margin-right: 9px; vertical-align: middle;
        box-shadow: 0 0 10px var(--cyan);
      }

      #overlay {
        position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; padding: 22px;
        background: radial-gradient(circle at 50% 40%, rgba(8, 16, 28, 0.55), rgba(2, 4, 9, 0.93) 64%);
        backdrop-filter: blur(7px); animation: fade 0.22s ease;
      }
      #overlay[hidden] { display: none; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

      .panel {
        position: relative; overflow: hidden;
        width: min(430px, 100%); text-align: center; padding: 28px 22px 22px; border-radius: 24px;
        background: linear-gradient(180deg, rgba(14, 25, 40, 0.94), rgba(7, 13, 23, 0.95));
        border: 1px solid var(--line2);
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: rise 0.26s ease;
      }
      .panel::before {
        content: ""; position: absolute; inset: 0 0 auto; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(63, 233, 255, 0.8), rgba(167, 139, 250, 0.6), transparent);
      }
      .panel h1 {
        margin: 0 0 8px; font-size: clamp(25px, 8vw, 36px); font-weight: 700; letter-spacing: 0.32em;
        color: #f3fbff; text-shadow: 0 0 30px rgba(63, 233, 255, 0.5), 0 0 90px rgba(63, 233, 255, 0.22);
      }
      .panel h2 {
        display: inline-block; margin: 0 0 18px; padding: 5px 13px; border-radius: 999px;
        border: 1px solid var(--line); background: rgba(10, 19, 31, 0.5);
        font-size: 10px; font-weight: 500; letter-spacing: 0.34em;
        color: var(--dim); text-transform: uppercase;
      }
      .panel p { margin: 0 0 14px; font-size: clamp(13px, 3.7vw, 15px); line-height: 1.6; color: #b6cfe0; }
      .big {
        font-size: clamp(46px, 14vw, 68px); font-weight: 700; line-height: 1; margin: 2px 0 10px;
        color: #fff; text-shadow: 0 0 40px rgba(63, 233, 255, 0.35);
      }
      .sub {
        font-size: 10px; letter-spacing: 0.2em; color: var(--violet); opacity: 0.92;
        margin-bottom: 18px; word-break: break-all;
      }
      .stats {
        display: grid; grid-template-columns: 1fr auto; gap: 9px 14px;
        margin: 0 auto 20px; max-width: 320px; text-align: left;
      }
      .stats > div:nth-child(odd) {
        font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--dim2); align-self: center;
      }
      .stats > div:nth-child(even) { text-align: right; font-size: 13px; font-weight: 600; color: #eaf6ff; }
      .stats b { font-weight: 600; }

      .actions { display: flex; flex-direction: column; gap: 10px; }
      button.primary, button.ghost {
        font: inherit; cursor: pointer; border-radius: 14px; padding: 15px 18px;
        letter-spacing: 0.18em; text-transform: uppercase; font-size: 11.5px; font-weight: 600;
        transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }
      button.primary {
        border: 0; color: #04202a;
        background: linear-gradient(180deg, #92f7ff, #37cfe8 55%, #22a8c4);
        box-shadow: 0 12px 32px rgba(55, 207, 232, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }
      button.primary:active { transform: translateY(1px) scale(0.995); }
      button.ghost {
        border: 1px solid var(--line2); background: rgba(12, 22, 36, 0.55); color: #bcd8ea;
      }
      button.ghost:active { transform: scale(0.99); }
      @media (hover: hover) {
        button.ghost:hover { border-color: rgba(126, 196, 236, 0.5); color: #e8f7ff; background: rgba(18, 32, 50, 0.7); }
        button.primary:hover { box-shadow: 0 16px 40px rgba(55, 207, 232, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.6); }
      }

      .toggle {
        display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%;
        border: 1px solid var(--line); background: rgba(10, 19, 31, 0.6); color: #cfe6f6;
        font: inherit; font-size: 12.5px; letter-spacing: 0.04em; padding: 13px 15px; border-radius: 14px;
        cursor: pointer; margin-bottom: 8px;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .toggle .sw {
        position: relative; flex: 0 0 auto; width: 40px; height: 22px; border-radius: 999px;
        background: rgba(126, 196, 236, 0.12); border: 1px solid var(--line2);
        transition: background 0.22s ease, border-color 0.22s ease;
      }
      .toggle .sw::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
        background: #8aa8bd; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        transition: transform 0.22s cubic-bezier(0.4, 0.1, 0.2, 1), background 0.22s ease, box-shadow 0.22s ease;
      }
      .toggle[data-on="true"] { border-color: rgba(63, 233, 255, 0.35); background: rgba(20, 44, 60, 0.5); }
      .toggle[data-on="true"] .sw {
        background: linear-gradient(90deg, rgba(63, 233, 255, 0.28), rgba(63, 233, 255, 0.55));
        border-color: rgba(63, 233, 255, 0.7);
      }
      .toggle[data-on="true"] .sw::after {
        transform: translateX(18px); background: #eafcff; box-shadow: 0 0 12px rgba(63, 233, 255, 0.9);
      }

      .hintline {
        margin-top: 14px; font-size: 9.5px; letter-spacing: 0.22em;
        color: rgba(143, 179, 203, 0.5); text-transform: uppercase;
      }

      #debug {
        position: fixed; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 5;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; line-height: 1.5;
        color: #7df0b4; background: rgba(2, 12, 8, 0.78); border: 1px solid rgba(125, 240, 180, 0.18);
        border-radius: 12px; padding: 9px 11px; white-space: pre; pointer-events: none;
        backdrop-filter: blur(8px);
      }
      #debug[hidden] { display: none; }

      /* On a phone the panel would sit on top of the hint pill, which is the one
         thing an idle player has to read. Lift it above the hint and cap it. */
      @media (max-width: 520px) {
        #debug {
          /* hint pill is bottom 84px and wraps to three lines: ~159px tall in total */
          bottom: calc(max(84px, env(safe-area-inset-bottom) + 76px) + 84px);
          font-size: 9.5px; line-height: 1.4; padding: 7px 9px; max-height: 46vh; overflow: hidden;
        }
        #hint { z-index: 6; }
        /* an open overlay must win: the diagnostics panel would cover its buttons */
        #debug:has(~ #overlay:not([hidden])) { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>

  <body>
    <div id="stage"></div>

    <div id="hud">
      <div class="row">
        <div>
          <div id="score">0</div>
          <div id="chain"></div>
        </div>
        <div>
          <button id="pauseBtn" aria-label="Pause">II</button>
          <div id="phase">PHASE 01</div>
          <div id="best">BEST 0</div>
        </div>
      </div>
    </div>

    <div id="hint"></div>
    <div id="debug" hidden></div>
    <div id="overlay"><div class="panel" id="panel"></div></div>

  </body>
